<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Teacher Planner — Asif National</title>

<!-- PWA: makes "Add to Home Screen" launch full-screen, app-like, no browser chrome -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1319">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- iOS Safari standalone mode (Android reads display:"standalone" from manifest.json above) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teacher Planner">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1319; --bg2:#141a22; --card:#1a212b; --card2:#1f2733;
  --line:#293241; --line2:#33404f;
  --ink:#eef2f6; --ink-dim:#a9b4c2; --ink-faint:#6b7787;
  --amber:#e0a458; --amber-soft:#f0c98a; --teal:#5fb9a8; --blue:#6fa3d8;
  --ok:#7fbf8a; --warn:#e0a458; --err:#e07a6f;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{min-height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh;
  padding-bottom:78px;
  font-size:14px; line-height:1.45;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
button{cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(15,19,25,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;flex-direction:column;}
.brand .eyebrow{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
.brand h1{font-size:19px;color:var(--ink);}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink-dim);
}
.icon-btn:active{background:var(--line2);}

.search-bar{margin-top:10px;position:relative;}
.search-bar input{
  width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:11px;
  padding:10px 12px 10px 34px;color:var(--ink);
}
.search-bar::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:0.5;}
.search-results{
  margin-top:8px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;
  max-height:340px;overflow-y:auto;
}
.search-results .sr-item{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.search-results .sr-item:last-child{border-bottom:none;}
.sr-cat{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--amber-soft);font-weight:700;margin-bottom:2px;}

/* ---------- Main ---------- */
main{padding:16px;max-width:560px;margin:0 auto;}
.page-title{font-size:20px;margin-bottom:4px;}
.page-sub{color:var(--ink-faint);font-size:12.5px;margin-bottom:16px;}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-faint);font-weight:700;margin-bottom:10px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;}
.stat .num{font-family:'Fraunces',serif;font-size:22px;color:var(--ink);}
.stat .lbl{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.stat.hot{border-color:rgba(224,164,88,0.4);background:linear-gradient(160deg,rgba(224,164,88,0.12),transparent);}
.stat.hot .num{color:var(--amber-soft);}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
.badge.ok{background:rgba(127,191,138,0.14);color:var(--ok);}
.badge.warn{background:rgba(224,164,88,0.14);color:var(--amber-soft);}
.badge.err{background:rgba(224,122,111,0.14);color:var(--err);}
.badge.muted{background:var(--card2);color:var(--ink-faint);}

.btn{
  border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{background:var(--line2);}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206;}
.btn.primary:active{background:var(--amber-soft);}
.btn.ghost{background:transparent;}
.btn.danger{border-color:rgba(224,122,111,0.5);color:var(--err);background:transparent;}
.btn.block{width:100%;}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:8px;}

.list{display:flex;flex-direction:column;gap:10px;}
.item{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;
}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.item .body{flex:1;min-width:0;}
.item .title{font-weight:600;font-size:14px;}
.item .meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.chev{color:var(--ink-faint);font-size:16px;}

.timeline-item{
  display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);
}
.timeline-item:last-child{border-bottom:none;}
.timeline-item.now{background:linear-gradient(90deg,rgba(224,164,88,0.10),transparent);border-radius:10px;margin:0 -6px;padding:13px 10px;}
.timeline-item .t{width:78px;flex:none;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;padding-top:1px;}
.timeline-item.now .t{color:var(--amber-soft);font-weight:700;}
.timeline-item .tbody{flex:1;}
.timeline-item .ttitle{font-weight:600;font-size:14px;}
.timeline-item .tnote{font-size:12px;color:var(--ink-faint);margin-top:2px;}

.empty{
  text-align:center;padding:34px 16px;color:var(--ink-faint);
}
.empty .big{font-size:28px;margin-bottom:8px;}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.tab{
  flex:none;background:var(--card2);border:1px solid var(--line2);color:var(--ink-dim);
  padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;
}
.tab.active{background:var(--amber);border-color:var(--amber);color:#1a1206;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:10px;
  padding:10px 12px;color:var(--ink);color-scheme:dark;
}
.field textarea{min-height:64px;resize:vertical;}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.chip-select{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:7px 12px;font-size:12.5px;color:var(--ink-dim);
}
.chip.on{background:rgba(224,164,88,0.16);border-color:var(--amber);color:var(--amber-soft);font-weight:600;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(15,19,25,0.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-faint);padding:6px 2px;border-radius:10px;
  font-size:9.5px;font-weight:700;letter-spacing:0.02em;
}
.navbtn .ic{font-size:17px;}
.navbtn.active{color:var(--amber-soft);}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--bg2);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
.modal-sheet.center{
  border-radius:16px;border-bottom:1px solid var(--line);max-width:420px;margin:auto;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h2{font-size:17px;}
.modal-close{background:var(--card2);border:1px solid var(--line2);border-radius:10px;width:32px;height:32px;color:var(--ink-dim);font-size:15px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions .btn{flex:1;}

.toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line2);color:var(--ink);
  padding:10px 16px;border-radius:24px;font-size:13px;font-weight:600;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.divider{height:1px;background:var(--line);margin:14px 0;}
.sub-heading{font-size:11px;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-faint);font-weight:700;margin:16px 0 8px;}
.progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-bar > div{height:100%;background:var(--teal);}
.two-col-item{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
.two-col-item:last-child{border-bottom:none;}
.stopblock{
  background:linear-gradient(160deg,rgba(224,164,88,0.12),rgba(224,164,88,0.02));
  border:1px solid rgba(224,164,88,0.32);border-radius:12px;padding:12px 14px;margin-bottom:10px;
}
.stopblock .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--amber-soft);font-weight:700;}
.stopblock .val{font-size:13.5px;margin-top:3px;color:var(--ink);}

@media (min-width:640px){
  .bottomnav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line);}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="eyebrow" id="brandEyebrow">Asif National</div>
      <h1 id="pageHeading">Dashboard</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="searchToggleBtn" title="Search">🔍</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>
  <div class="search-bar" id="searchBar" style="display:none;">
    <input type="text" id="searchInput" placeholder="Search students, subjects, records…">
    <div class="search-results" id="searchResults" style="display:none;"></div>
  </div>
</div>

<main id="view"></main>

<div class="bottomnav" id="bottomNav"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================================
   TEACHER PLANNER — core.js (storage, ids, time/date, prayer service)
   ========================================================================= */
const TZ = 'Asia/Dhaka';
// Bumped on every shipped update — check Settings against this to confirm
// you're actually running the latest file, not a stale cached/undeployed one.
const APP_BUILD = '2026-08-23.1';
const DB_KEY = 'tp_db_v1';
const SUBJECT_DEFAULTS = ['Bangla','English','English 1st Paper','English 2nd Paper','Math','Physics','Chemistry','Biology','Science','Social Science','General Knowledge','Spoken English','মাশক','Other'];

function uid(prefix){
  const rand = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2));
  return (prefix?prefix+'_':'') + rand;
}

function defaultDB(){
  return {
    version:2,
    settings:{
      teacherName:'Md. Asif Khan',
      brand:'Asif National',
      location:'Rajshahi, Bangladesh',
      timezone: TZ,
      city:'Rajshahi', country:'Bangladesh', prayerMethod:1,
      theme:'dark',
      onboarded:false,
      // Maghrib-linked class slot (e.g. Safa) — configurable, not hard-coded
      maghribStudentId:null, maghribOffsetMin:20, maghribDurationMin:70,
      // Google Drive auto-backup
      // Backup: no OAuth needed — uses the phone's native Share sheet into the Drive app
      lastManualBackupAt:null,
      // Off days & salary reference — see offDays[] below for personal/unplanned offs.
      // weeklyOffDay: a day name like "Friday", or null for none. Recurring, no
      // salary impact, no makeup tracking — it's just a normal non-teaching day.
      weeklyOffDay:null,
      monthlySalary:0,
      // Google Sheets backup (push-only from the app; restore is on-demand/manual).
      sheetsWebAppUrl:'', sheetsAutoBackup:false, lastSheetsBackupAt:null,
      // PIN confirmation gate for Export/Import/Restore — protects against
      // accidental taps and, for the Sheets restore endpoint specifically, is
      // also checked server-side by the Apps Script itself.
      backupPin:'274336'
    },
    students:[],      // {id,name,nickname,type:'madrasa'|'batch'|'private',class,school,guardianName,guardianPhone,area,subjects:[],monthlyFee,joiningDate,active,notes,createdAt}
    subjects:[...SUBJECT_DEFAULTS],
    classRecords:[],  // {id,studentId,subject,date,chapter,topic,page,completed,homework,homeworkDeadline,understanding,weakness,nextTopic,note,createdAt}
    homework:[],      // {id,studentId,subject,homework,givenDate,dueDate,status,classRecordId}
    attendance:[],    // {id,studentId,date,status}
    exams:[],         // {id,name,studentId,subject,chapter,date,total,obtained,notes,status:'Scheduled'|'Completed'}
    fees:[],          // {id,studentId,month,monthlyFee,paid,paymentDate,method,notes}
    tasks:[],         // {id,title,date,priority,completed,notes}
    syllabus:[],      // {id,studentId,subject,chapter,topic,status}
    studyPlan:[],
    prayerTimes:{},    // { 'YYYY-MM-DD': {location,maghrib,fetchedAt} }
    // Personal/unplanned off days (NOT the recurring weekly off — see settings.weeklyOffDay).
    // Purely a tracking + reminder tool: no automatic salary deduction is ever computed.
    offDays:[],       // {id,date,reason,makeupNeeded,makeupDate,makeupDone,createdAt}
    // Log of a class actually finishing early (or otherwise deviating from the
    // fixed schedule) on a specific date — the recurring schedule itself is
    // untouched; this is just a record of what really happened that day.
    sessionLogs:[],   // {id,date,studentId,title,scheduledStart,scheduledEnd,actualEnd,createdAt}
    // Editable daily timetable (excludes the Maghrib-linked slot, which is computed
    // dynamically from settings.maghribStudentId/Offset/Duration each render).
    schedule: defaultScheduleBlocks()
  };
}

function defaultScheduleBlocks(){
  return [

    {id:uid('blk'), start:'08:00',end:'09:00',title:'1st Period — English / Math',note:'Class 3',type:'madrasa',studentId:null},
    {id:uid('blk'), start:'09:00',end:'09:30',title:'Spoken English',note:'',type:'madrasa',studentId:null},
    {id:uid('blk'), start:'09:30',end:'09:50',title:'মাশক',note:'',type:'madrasa',studentId:null},
    {id:uid('blk'), start:'09:50',end:'10:30',title:'3rd Period — Social Science / Science / GK',note:'Class 3',type:'madrasa',studentId:null},
    {id:uid('blk'), start:'10:30',end:'10:40',title:'Break',note:'',type:'break',studentId:null},
    {id:uid('blk'), start:'10:40',end:'11:20',title:'4th Period — Math',note:'Class 2',type:'madrasa',studentId:null},
    {id:uid('blk'), start:'11:20',end:'12:45',title:'5th Period — Math + Bangla / SS / Science / Kitab',note:'',type:'madrasa',studentId:null},
    {id:uid('blk'), start:'12:45',end:'13:00',title:'Return home',note:'',type:'transit',studentId:null},
    {id:uid('blk'), start:'13:00',end:'15:56',title:'Free / Rest Block',note:'Protected — not auto-filled with work',type:'rest',studentId:null},
    {id:uid('blk'), start:'16:00',end:'17:15',title:"4 o'clock Batch",note:'Class 9 · English, Math',type:'batch',studentId:null,linkName:"4 o'clock Batch"},
    {id:uid('blk'), start:'17:15',end:'18:15',title:'Anika',note:'Class 6 · Private · All subjects',type:'private',studentId:null,linkName:'Anika'},
  ];
}

let DB = loadDB();

// Shared merge so a fresh load AND a manual "Import Backup" both survive schema
// additions the same way — new fields fall back to defaults, nothing is dropped.
function mergeIntoDefaults(parsed){
  const base = defaultDB();
  const merged = Object.assign(base, parsed, {
    settings: Object.assign(base.settings, parsed.settings||{})
  });
  // Old backups (pre-schedule-editor) won't have `schedule` at all — already
  // covered by Object.assign falling back to base.schedule. But some may have
  // an EMPTY array if they were created between versions; treat empty as "unset".
  if(!Array.isArray(merged.schedule) || merged.schedule.length===0){
    merged.schedule = defaultScheduleBlocks();
  }
  // best-effort: resolve old name-based links (linkName) to actual studentId
  // once students are available, so upgraded installs don't lose their links.
  merged.schedule.forEach(blk=>{
    if(!blk.studentId && blk.linkName){
      const match = (merged.students||[]).find(s=>s.name===blk.linkName);
      if(match) blk.studentId = match.id;
    }
  });
  if(!merged.settings.maghribStudentId){
    const safa = (merged.students||[]).find(s=>s.name==='Safa');
    if(safa) merged.settings.maghribStudentId = safa.id;
  }
  // Migration: "isGroup" generalizes what used to be hardcoded to type==='batch'.
  // Any student that already had type 'batch' is, by definition, a group
  // container — carry that forward automatically so nothing about existing
  // batches changes behavior after this update.
  (merged.students||[]).forEach(s=>{
    if(s.isGroup===undefined) s.isGroup = (s.type==='batch');
  });
  return merged;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return mergeIntoDefaults(parsed);
  }catch(e){
    console.error('DB load failed, starting fresh', e);
    return defaultDB();
  }
}
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){
    console.error('DB save failed', e);
    toast('⚠ Could not save — storage may be full');
  }
  scheduleSheetsBackup();
}

/* ---------------- date / time helpers (Asia/Dhaka authoritative) ---------------- */
function todayISO(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
}
function addDaysISO(iso, days){
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+days);
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(d);
}
function nowDhakaParts(){
  const fmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
  const parts = fmt.formatToParts(new Date());
  const h = parseInt(parts.find(p=>p.type==='hour').value,10);
  const m = parseInt(parts.find(p=>p.type==='minute').value,10);
  return {h,m};
}
function nowMinutes(){ const {h,m}=nowDhakaParts(); return h*60+m; }
function readableDate(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);
}
function weekdayShort(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short'}).format(d);
}
function weekdayLong(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long'}).format(d);
}
function daysInMonth(monthISO){ // 'YYYY-MM' -> number of days
  const [y,m] = monthISO.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

/* ---------------- Off days: weekly (recurring, no impact) + personal (tracked) ---------------- */
function isWeeklyOff(iso){
  return !!DB.settings.weeklyOffDay && weekdayLong(iso) === DB.settings.weeklyOffDay;
}
function personalOffFor(iso){
  return (DB.offDays||[]).find(o=>o.date===iso) || null;
}
function isOffDay(iso){
  return isWeeklyOff(iso) || !!personalOffFor(iso);
}
function pendingMakeups(){
  return (DB.offDays||[]).filter(o=>o.makeupNeeded && !o.makeupDone).sort((a,b)=>a.date.localeCompare(b.date));
}
function weeklyOffCountInMonth(monthISO){
  if(!DB.settings.weeklyOffDay) return 0;
  const total = daysInMonth(monthISO);
  let count=0;
  for(let d=1; d<=total; d++){
    const iso = `${monthISO}-${String(d).padStart(2,'0')}`;
    if(isWeeklyOff(iso)) count++;
  }
  return count;
}
function personalOffCountInMonth(monthISO){
  return (DB.offDays||[]).filter(o=>o.date.startsWith(monthISO)).length;
}
function perDayRate(monthISO){
  // Fixed monthly salary — paid the same regardless of the weekly off day
  // (confirmed: Friday off still gets paid since it's a monthly arrangement),
  // so the denominator is every calendar day in the month, not "working days."
  const salary = Number(DB.settings.monthlySalary)||0;
  if(salary<=0) return null;
  const total = daysInMonth(monthISO);
  if(total<=0) return null;
  return salary / total;
}
function daysElapsedInMonth(monthISO){
  const today = todayISO();
  if(monthISO === today.slice(0,7)) return parseInt(today.slice(8,10),10);
  if(monthISO < today.slice(0,7)) return daysInMonth(monthISO); // a past month is fully elapsed
  return 0; // a future month hasn't started
}
function parseHHMM(raw){
  if(!raw) return null;
  const m = /^(\d{1,2}):(\d{2})/.exec(String(raw).trim());
  if(!m) return null;
  const h=parseInt(m[1],10), mi=parseInt(m[2],10);
  if(h<0||h>23||mi<0||mi>59) return null;
  return {h,m:mi};
}
function toMinutes(t){ return t.h*60+t.m; }
function fromMinutes(mins){ mins=((mins%1440)+1440)%1440; return {h:Math.floor(mins/60), m:mins%60}; }
function addMinutes(t,mins){ return fromMinutes(toMinutes(t)+mins); }
function fmt12(t){ if(!t) return '—'; const period=t.h>=12?'PM':'AM'; let h12=t.h%12; if(h12===0)h12=12; return `${h12}:${String(t.m).padStart(2,'0')} ${period}`; }
function fmt24(t){ return `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`; }
function formatDuration(mins){
  mins = Math.max(0, Math.round(mins));
  if(mins < 1) return 'less than a minute';
  const h = Math.floor(mins/60), m = mins%60;
  if(h===0) return `${m} min`;
  if(m===0) return `${h}h`;
  return `${h}h ${m}m`;
}
function fmtMoney(n){ n = Number(n)||0; return '৳' + n.toLocaleString('en-IN'); }

/* =========================================================================
   PRAYER SERVICE — isolated, replaceable. AlAdhan public API, no key needed.
   ========================================================================= */
const PrayerService = (function(){
  function apiDate(iso){ const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }

  async function fetchPrayerTimes(iso){
    const { city, country, prayerMethod } = DB.settings;
    const url = `https://api.aladhan.com/v1/timingsByCity/${apiDate(iso)}?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${prayerMethod}`;
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 8000);
    try{
      const res = await fetch(url,{signal:controller.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      if(!json || json.code!==200 || !json.data || !json.data.timings || !json.data.timings.Maghrib){
        throw new Error('Invalid API response');
      }
      const parsed = parseHHMM(json.data.timings.Maghrib);
      if(!parsed) throw new Error('Unparseable Maghrib');
      return { location: `${city}, ${country}`, maghrib: fmt24(parsed), fetchedAt: new Date().toISOString() };
    }catch(e){
      clearTimeout(timer);
      throw e;
    }
  }

  function getCached(iso){ return DB.prayerTimes[iso] || null; }
  function setCached(iso,data){ DB.prayerTimes[iso]=data; saveDB(); }

  /**
   * getMaghribTime(iso, {forceRefresh}) -> { maghrib:'HH:MM'|null, source:'api'|'cache'|null, status:'ok'|'warn'|'err', message:string }
   */
  async function getMaghribTime(iso, opts){
    opts = opts||{};
    const cached = getCached(iso);
    if(!opts.forceRefresh && cached){
      // return cache instantly; caller may still trigger a background refresh
      return { maghrib:cached.maghrib, source:'cache', status:'ok', message:'Loaded from saved prayer time.' };
    }
    try{
      const fresh = await fetchPrayerTimes(iso);
      setCached(iso, fresh);
      return { maghrib:fresh.maghrib, source:'api', status:'ok', message:'Prayer time updated from API.' };
    }catch(e){
      if(cached){
        return { maghrib:cached.maghrib, source:'cache', status:'warn', message:'Using saved prayer time — API unavailable.' };
      }
      return { maghrib:null, source:null, status:'err', message:'Maghrib time unavailable.' };
    }
  }

  return { fetchPrayerTimes, getMaghribTime, getCached };
})();

/* =========================================================================
   BACKUP — no-signup approach. Uses the phone's native Share sheet so the
   backup file goes straight into the Google Drive app the person already
   has installed and logged into. No OAuth, no Google Cloud project, no card.
   Paired with a simple "it's been a while" reminder so nothing gets forgotten.
   ========================================================================= */
function buildBackupFile(){
  const content = JSON.stringify(DB, null, 2);
  const filename = `teacher-planner-backup-${todayISO()}.json`;
  return { content, filename };
}

async function shareBackupToDrive(){
  const { content, filename } = buildBackupFile();
  const file = new File([content], filename, {type:'application/json'});

  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({
        files:[file],
        title:'Teacher Planner Backup',
        text:'Save this to Google Drive to keep your data safe.'
      });
      DB.settings.lastManualBackupAt = new Date().toISOString();
      localStorage.setItem(DB_KEY, JSON.stringify(DB));
      if(ROUTE.page==='settings') render();
      toast('Backup shared — choose Drive to save it there');
    }catch(err){
      if(err.name !== 'AbortError'){ // user cancelling the share sheet isn't an error
        console.warn('Share failed, falling back to download', err);
        downloadBackupFile();
      }
    }
  }else{
    // Desktop browsers / older Android WebViews don't support sharing files —
    // fall back to a normal download, which the person can then move into
    // Drive manually via the Drive app or Files app "Move to" option.
    downloadBackupFile();
    toast('Downloaded — open it with the Google Drive app to save it there');
  }
}

function downloadBackupFile(){
  const { content, filename } = buildBackupFile();
  const blob = new Blob([content], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  DB.settings.lastManualBackupAt = new Date().toISOString();
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  if(ROUTE.page==='settings') render();
}

// How many days without a backup before we gently remind them.
const BACKUP_REMINDER_DAYS = 7;
function daysSinceLastBackup(){
  if(!DB.settings.lastManualBackupAt) return Infinity;
  const diffMs = Date.now() - new Date(DB.settings.lastManualBackupAt).getTime();
  return Math.floor(diffMs / (1000*60*60*24));
}

/* =========================================================================
   GOOGLE SHEETS BACKUP — push-only from the app (auto + manual). Restore is
   on-demand, gated only by a local confirm() before overwriting data. The
   real access control is the Web App URL itself — without it, the endpoint
   is unreachable, so there's no separate PIN layer on top of that.
   Uses Content-Type: text/plain on POST specifically to avoid a CORS
   preflight, which Apps Script Web Apps don't handle — this is the standard
   workaround; the Apps Script side still parses the body as JSON regardless
   of the declared content type.
   ========================================================================= */
let sheetsBackupTimer = null;
function scheduleSheetsBackup(){
  if(!DB.settings.sheetsAutoBackup || !DB.settings.sheetsWebAppUrl) return;
  clearTimeout(sheetsBackupTimer);
  sheetsBackupTimer = setTimeout(pushToSheets, 5000);
}

async function pushToSheets(silent){
  const url = DB.settings.sheetsWebAppUrl;
  if(!url) { if(!silent) toast('⚠ Add your Apps Script Web App URL in Settings first'); return; }
  if(!silent) toast('Backing up to Sheet…');
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ data: DB })
    });
    const json = await res.json().catch(()=>({ok:false,error:'Bad response'}));
    if(!json.ok) throw new Error(json.error||'Unknown error');
    DB.settings.lastSheetsBackupAt = new Date().toISOString();
    localStorage.setItem(DB_KEY, JSON.stringify(DB)); // direct write — avoid re-triggering saveDB's own debounce loop
    if(ROUTE.page==='settings') render();
    if(!silent) toast('Backed up to Sheet');
  }catch(err){
    console.warn('Sheets backup failed (will retry on next change):', err);
    if(!silent) toast('⚠ Sheet backup failed — check the URL and your connection');
  }
}

async function restoreFromSheets(){
  const url = DB.settings.sheetsWebAppUrl;
  if(!url){ alert('Add your Apps Script Web App URL in Settings first.'); return; }
  try{
    toast('Fetching backup…');
    const res = await fetch(`${url}?action=restore`);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error||'Restore failed');
    const parsed = json.data;
    if(!parsed || !Array.isArray(parsed.students)) throw new Error('Backup on the sheet looks corrupted or empty');
    if(!confirm('Replace ALL current data with the Google Sheet backup? This cannot be undone.')) return;
    DB = mergeIntoDefaults(parsed);
    saveDB();
    navigate('dashboard');
    toast('Restored from Google Sheet');
  }catch(err){
    alert('Restore failed: ' + err.message);
  }
}

/* =========================================================================
   SCHEDULE SERVICE — editable timetable (DB.schedule) + dynamic Maghrib slot
   ========================================================================= */
function buildDaySchedule(iso, maghribHHMM){
  const blocks = (DB.schedule && DB.schedule.length) ? DB.schedule : defaultScheduleBlocks();
  const items = blocks.map(s=>({...s, startMin:toMinutes(parseHHMM(s.start)), endMin:toMinutes(parseHHMM(s.end))}));
  let conflict = null;
  if(maghribHHMM){
    const maghrib = parseHHMM(maghribHHMM);
    const offset = Number(DB.settings.maghribOffsetMin)||20;
    const duration = Number(DB.settings.maghribDurationMin)||70;
    const linkedStudent = DB.settings.maghribStudentId ? studentById(DB.settings.maghribStudentId) : null;
    items.push({start:fmt24(maghrib),end:fmt24(maghrib),title:'Maghrib',note:'Fetched automatically',type:'maghrib',studentId:null,startMin:toMinutes(maghrib),endMin:toMinutes(maghrib)});
    const slotStart = addMinutes(maghrib,offset);
    const slotEnd = addMinutes(slotStart,duration);
    items.push({
      start:fmt24(slotStart), end:fmt24(slotEnd),
      title: linkedStudent ? linkedStudent.name : 'Maghrib-based class',
      note: linkedStudent ? `${typeLabel(linkedStudent.type)} · Maghrib + ${offset} min` : `Set a student in Settings → Maghrib class`,
      type:'private', studentId: linkedStudent?linkedStudent.id:null,
      startMin:toMinutes(slotStart), endMin:toMinutes(slotEnd)
    });
    // conflict check: does the Maghrib-linked slot overlap any fixed block that starts before it ends?
    const overlapping = items.find(b => b.type!=='maghrib' && b.studentId!==(linkedStudent?linkedStudent.id:'__none__') && b.startMin < toMinutes(slotEnd) && b.endMin > toMinutes(slotStart) && b.title !== (linkedStudent?linkedStudent.name:''));
    if(overlapping){
      conflict = `The Maghrib-linked class (starts ${fmt12(slotStart)}) overlaps "${overlapping.title}", which runs until ${fmt12(fromMinutes(overlapping.endMin))}.`;
    }
  }
  items.sort((a,b)=>a.startMin-b.startMin);
  return {items, conflict};
}

function scheduleStatusFor(item, nowMin){
  if(item.type==='maghrib') return nowMin>=item.startMin && nowMin < item.startMin+1 ? 'now' : (nowMin>item.startMin?'past':'upcoming');
  if(nowMin>=item.startMin && nowMin<item.endMin) return 'now';
  if(nowMin>=item.endMin) return 'past';
  return 'upcoming';
}

/* =========================================================================
   DATA HELPERS (queries across collections)
   ========================================================================= */
function activeStudents(){ return DB.students.filter(s=>s.active!==false); }
// For headcount purposes only — excludes group/batch containers, which aren't
// real individual students even though they live in the same DB.students list.
function individualStudents(){ return activeStudents().filter(s=>!s.isGroup); }
function studentById(id){ return DB.students.find(s=>s.id===id); }
function batchMembers(batchId){ return DB.students.filter(s=>s.batchId===batchId); }
function lastClassRecord(studentId, subject){
  let recs = DB.classRecords.filter(r=>r.studentId===studentId && (!subject || r.subject===subject));
  if(recs.length===0){
    // A batch member with no personal override yet — fall back to the shared
    // class record recorded for the whole batch.
    const student = studentById(studentId);
    if(student && student.batchId){
      recs = DB.classRecords.filter(r=>r.studentId===student.batchId && (!subject || r.subject===subject));
    }
  }
  if(recs.length===0) return null;
  return recs.slice().sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0];
}
function pendingHomeworkCount(){ return DB.homework.filter(h=>h.status==='Pending'||h.status==='Late').length; }
function upcomingExams(days){
  const today = todayISO();
  const limit = new Date(today); limit.setDate(limit.getDate()+(days||14));
  const limitISO = limit.toISOString().slice(0,10);
  // "Upcoming" = scheduled and not yet marked — old records with no status field
  // already have marks, so they default to Completed and are excluded here.
  return DB.exams.filter(e=>e.date>=today && e.date<=limitISO && (e.status||'Completed')!=='Completed').sort((a,b)=>a.date.localeCompare(b.date));
}
function awaitingResultsExams(){
  // Exam date has already passed (or is today) but marks were never entered —
  // these are easy to lose track of since you'd otherwise have to remember to
  // go find them under each student's Exams tab.
  // Also treats "obtained > 0" as proof marks WERE entered even if the status
  // field itself is stuck on "Scheduled" from before this check existed —
  // so an already-graded exam doesn't keep reappearing here.
  const today = todayISO();
  return DB.exams.filter(e=>e.date<=today && (e.status||'Completed')==='Scheduled' && !(Number(e.obtained)>0)).sort((a,b)=>a.date.localeCompare(b.date));
}
function unpaidFeesCount(monthISO){
  const month = monthISO || todayISO().slice(0,7);
  return individualStudents().filter(s=>s.monthlyFee>0).filter(s=>{
    const f = DB.fees.find(x=>x.studentId===s.id && x.month===month);
    const paid = f? Number(f.paid||0) : 0;
    return paid < Number(s.monthlyFee||0);
  }).length;
}
function feeStatusFor(student, monthISO){
  const month = monthISO || todayISO().slice(0,7);
  const f = DB.fees.find(x=>x.studentId===student.id && x.month===month);
  const expected = Number(student.monthlyFee||0);
  const paid = f? Number(f.paid||0):0;
  const due = Math.max(0, expected-paid);
  const advance = Math.max(0, paid-expected);
  let status='Due';
  if(expected===0) status='—';
  else if(paid>expected) status='Advance';
  else if(paid>=expected && expected>0) status='Paid';
  else if(paid>0) status='Partial';
  return {expected,paid,due,advance,status,record:f};
}
function attendanceStatsFor(studentId){
  const recs = DB.attendance.filter(a=>a.studentId===studentId);
  const present = recs.filter(a=>a.status==='Present').length;
  const absent = recs.filter(a=>a.status==='Absent').length;
  const late = recs.filter(a=>a.status==='Late').length;
  const cancelled = recs.filter(a=>a.status==='Cancelled').length;
  const total = present+absent+late;
  const pct = total>0 ? Math.round(((present+late*0.5)/total)*100) : null;
  return {present,absent,late,cancelled,total,pct};
}
// One student can only have ONE attendance status per date — this updates the
// existing record instead of pushing a duplicate, so re-marking (e.g. fixing
// a mistake) actually corrects it rather than corrupting the stats with two
// records for the same day.
function upsertAttendance(studentId, date, status){
  const existing = DB.attendance.find(a=>a.studentId===studentId && a.date===date);
  if(existing){ existing.status = status; }
  else{ DB.attendance.push({id:uid('att'), studentId, date, status}); }
}
function subjectProgress(studentId, subject){
  const items = DB.syllabus.filter(s=>s.studentId===studentId && s.subject===subject);
  if(items.length===0) return null;
  const done = items.filter(i=>i.status==='Completed').length;
  return Math.round((done/items.length)*100);
}
function examAverage(studentId, subject){
  const list = DB.exams.filter(e=>e.studentId===studentId && (!subject||e.subject===subject) && (e.status||'Completed')==='Completed');
  if(list.length===0) return null;
  const pct = list.map(e=> e.total>0 ? (e.obtained/e.total*100):0);
  return Math.round(pct.reduce((a,b)=>a+b,0)/pct.length);
}

function sessionLogFor(date, scheduledStart){
  return (DB.sessionLogs||[]).find(l=>l.date===date && l.scheduledStart===scheduledStart) || null;
}
// Actual minutes taught: uses actualStart/actualEnd where logged, otherwise
// falls back to the scheduled time for that side — so a session with only
// an early-start log still measures correctly against its scheduled end.
function sessionActualMinutes(log){
  const startT = log.actualStart ? parseHHMM(log.actualStart) : parseHHMM(log.scheduledStart);
  const endT = log.actualEnd ? parseHHMM(log.actualEnd) : parseHHMM(log.scheduledEnd);
  return Math.max(0, toMinutes(endT) - toMinutes(startT));
}

// Upserts a session log entry for today's block at scheduledStart — a block
// can accumulate BOTH an early start and an early end over the course of the
// same day without creating duplicate entries.
function logSessionDeviation(scheduledStart, title, fields){
  const {items} = buildDaySchedule(todayISOState, todayMaghribInfo.maghrib);
  const block = items.find(i=>i.start===scheduledStart && i.title===title);
  if(!block) return;
  DB.sessionLogs = DB.sessionLogs || [];
  let log = DB.sessionLogs.find(l=>l.date===todayISOState && l.scheduledStart===scheduledStart);
  if(!log){
    log = {id: uid('slog'), date: todayISOState, studentId: block.studentId||null, title: block.title,
      scheduledStart: block.start, scheduledEnd: block.end, createdAt: new Date().toISOString()};
    DB.sessionLogs.push(log);
  }
  Object.assign(log, fields);
  saveDB(); render();
  toast(`Logged — see full history in Reports → Session Log`);
}

function bindScheduleEditor(){
  const view = document.getElementById('view');
  view.querySelector('#doneEditScheduleBtn').addEventListener('click', ()=>{ todayEditMode=false; render(); });

  // Reads whatever is currently sitting in the form fields back into DB.schedule.
  // Called before Add/Delete so those actions never silently wipe edits you'd
  // already made to OTHER blocks in the same session — that was the bug.
  function harvestFormIntoSchedule(){
    view.querySelectorAll('[data-block]').forEach(card=>{
      const id = card.dataset.block;
      const blk = DB.schedule.find(b=>b.id===id);
      if(!blk) return;
      blk.start = card.querySelector('[data-f="start"]').value || blk.start;
      blk.end = card.querySelector('[data-f="end"]').value || blk.end;
      blk.title = card.querySelector('[data-f="title"]').value.trim() || blk.title;
      blk.type = card.querySelector('[data-f="type"]').value || blk.type;
      blk.note = card.querySelector('[data-f="note"]').value.trim();
      blk.studentId = card.querySelector('[data-f="studentId"]').value || null;
    });
    const maghribSel = view.querySelector('#se_maghribStudent');
    if(maghribSel){
      DB.settings.maghribStudentId = maghribSel.value || null;
      DB.settings.maghribOffsetMin = Number(view.querySelector('#se_offset').value) || DB.settings.maghribOffsetMin;
      DB.settings.maghribDurationMin = Number(view.querySelector('#se_duration').value) || DB.settings.maghribDurationMin;
    }
  }

  view.querySelector('#se_addBlockBtn').addEventListener('click', ()=>{
    harvestFormIntoSchedule();
    DB.schedule.push({id:uid('blk'), start:'16:00', end:'17:00', title:'New Block', note:'', type:'other', studentId:null});
    saveDB(); render();
  });
  view.querySelectorAll('[data-del-block]').forEach(el=>el.addEventListener('click',()=>{
    if(confirm('Delete this schedule block?')){
      harvestFormIntoSchedule();
      DB.schedule = DB.schedule.filter(b=>b.id!==el.dataset.delBlock); saveDB(); render();
    }
  }));
  view.querySelector('#se_saveBtn').addEventListener('click', ()=>{
    harvestFormIntoSchedule();
    saveDB();
    todayEditMode = false;
    render();
    toast('Schedule saved');
  });
}
function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

   ========================================================================= */
// A group (batch, madrasa class, etc.) gets the SAME tabs as any individual
// student — being a group only ADDS a Members section to Overview and a
// bulk-record option to Class Records. It must never REMOVE access to a
// group's own Fees/Homework/Attendance/Exams data — that data doesn't
// disappear when isGroup is set, but it becomes unreachable if the tab that
// shows it is gone, which is exactly the bug this fixes.
const STUDENT_TABS = [['overview','Overview'],['records','Class Records'],['homework','Homework'],['attendance','Attendance'],['exams','Exams'],['fees','Fees'],['syllabus','Progress']];

function renderStudentDetail(id, tab){
  const s = studentById(id);
  if(!s) return `<div class="empty">Student not found.</div>`;
  const isGroup = s.isGroup===true;
  const tabs = STUDENT_TABS;
  let body='';
  if(tab==='overview') body = isGroup ? batchOverviewTab(s) : studentOverviewTab(s);
  else if(tab==='records') body = isGroup ? batchRecordsTab(s) : studentRecordsTab(s);
  else if(tab==='homework') body = studentHomeworkTab(s);
  else if(tab==='attendance') body = studentAttendanceTab(s);
  else if(tab==='exams') body = studentExamsTab(s);
  else if(tab==='fees') body = studentFeesTab(s);
  else if(tab==='syllabus') body = studentSyllabusTab(s);

  const parentBatch = s.batchId ? studentById(s.batchId) : null;

  return `
  <button class="btn sm ghost" id="backToStudents" style="margin-bottom:10px;">‹ Students</button>
  <div class="row" style="align-items:flex-start;margin-bottom:6px;">
    <div>
      <h2 style="font-size:19px;">${escapeHTML(s.name)} ${isGroup?'<span class="badge muted">Group</span>':''}</h2>
      <div class="page-sub" style="margin:2px 0 0;">${typeLabel(s.type)} · Class ${escapeHTML(s.class||'—')}${s.school?' · '+escapeHTML(s.school):''}</div>
      ${parentBatch? `<div class="page-sub" style="margin:2px 0 0;cursor:pointer;color:var(--amber-soft);" data-open-student="${parentBatch.id}">Part of: ${escapeHTML(parentBatch.name)} ›</div>`:''}
    </div>
    <button class="icon-btn" id="editStudentBtn">✎</button>
  </div>
  <div class="tabs">
    ${tabs.map(([id2,label])=>`<div class="tab ${tab===id2?'active':''}" data-tab="${id2}">${label}</div>`).join('')}
  </div>
  ${body}
  `;
}

    return `
    <div class="card" style="padding:12px 14px;margin-bottom:10px;">
      <div class="row">
        <b>${monthLabel(m)}</b>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="badge ${feeBadgeClass(f.status)}">${f.status}${f.status==='Advance'?' +'+fmtMoney(f.advance):''}</span>
          <button class="icon-btn" style="width:28px;height:28px;font-size:12px;" data-edit-fee="${s.id}|${m}" title="Edit / correct this month">✎</button>
        </div>
      </div>
      <div class="page-sub" style="margin-top:4px;">Paid ${fmtMoney(f.paid)} of ${fmtMoney(f.expected)} · Due ${fmtMoney(f.due)}</div>
      ${f.expected>0 && f.status!=='Paid' && f.status!=='Advance'?`<button class="btn sm" style="margin-top:8px;" data-mark-paid="${s.id}|${m}">Mark fully paid</button>`:''}
    </div>`;
  }).join('')}
  </div>
  `;
}
function feeBadgeClass(status){ return status==='Paid'?'ok':status==='Advance'?'ok':status==='Partial'?'warn':'err'; }
function monthsWindow(pastCount, futureCount){
  const arr=[]; const d=new Date(todayISO()+'T12:00:00');
  for(let i=(futureCount||0); i>=-(pastCount||0); i--){
    const y=d.getFullYear(), m=d.getMonth()+1-i; const dd=new Date(y,m-1,1);
    arr.push(dd.toISOString().slice(0,7));
  }
  return arr;
}
function lastNMonths(n){
  const arr=[]; const d=new Date(todayISO()+'T12:00:00');
  for(let i=0;i<n;i++){ const y=d.getFullYear(),m=d.getMonth()+1-i; const dd=new Date(y,m-1,1); arr.push(dd.toISOString().slice(0,7)); }
  return arr;
}
function monthLabel(m){ const [y,mo]=m.split('-'); return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}); }

  <div class="sub-heading">Personal Tasks</div>

function renderReports(){
  const month = todayISO().slice(0,7);
  const classesTaken = DB.classRecords.filter(r=>r.date.startsWith(month)).length;
  const examsThisMonth = DB.exams.filter(e=>e.date.startsWith(month)).length;

  // Split by source: a student who's a member of a group (batchId set) counts
  // as "batch/group" income even though they're tracked individually — a
  // standalone private student (no batchId) counts as "private" income.
  let privateCollected=0, privateDue=0, batchCollected=0, batchDue=0;
  activeStudents().filter(s=>s.monthlyFee>0 && !s.isGroup).forEach(s=>{
    const f=feeStatusFor(s,month);
    if(s.batchId){ batchCollected+=f.paid; batchDue+=f.due; }
    else{ privateCollected+=f.paid; privateDue+=f.due; }
  });
  const collected = privateCollected + batchCollected;
  const dueTotal = privateDue + batchDue;

  const rate = perDayRate(month); // salary ÷ total calendar days — Friday off is still paid
  const elapsed = daysElapsedInMonth(month);
  const accruedSoFar = rate!==null ? rate*elapsed : null;
  const privatePerDaySoFar = elapsed>0 ? privateCollected/elapsed : null;
  const batchPerDaySoFar = elapsed>0 ? batchCollected/elapsed : null;
  const personalOffsThisMonth = (DB.offDays||[]).filter(o=>o.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
  const weeklyOffs = weeklyOffCountInMonth(month);

  return `
  <div class="card">
    <div class="card-title">Monthly Teaching Report — ${monthLabel(month)}</div>
    <div class="two-col-item"><span>Classes recorded</span><b>${classesTaken}</b></div>
    <div class="two-col-item"><span>Active students</span><b>${individualStudents().length}</b></div>
    <div class="two-col-item"><span>Exams held</span><b>${examsThisMonth}</b></div>
  </div>

  ${(DB.settings.monthlySalary>0 || collected>0) ? `
  <div class="card">
    <div class="card-title">Income Reference — ${monthLabel(month)}</div>
    <div class="hint" style="margin-bottom:12px;">Three separate income sources, shown separately since they work differently. Reference only — nothing here is ever deducted automatically.</div>

    ${DB.settings.monthlySalary>0 ? `
    <div class="sub-heading" style="margin-top:0;">Madrasa Salary (fixed monthly)</div>
    <div class="two-col-item"><span>Monthly salary</span><b>${fmtMoney(DB.settings.monthlySalary)}</b></div>
    ${rate!==null? `<div class="two-col-item"><span>Per-day rate (salary ÷ ${daysInMonth(month)} days)</span><b>${fmtMoney(rate)}</b></div>` : ''}
    ${accruedSoFar!==null? `<div class="two-col-item"><span>Accrued so far (${elapsed} days elapsed)</span><b>${fmtMoney(accruedSoFar)}</b></div>` : ''}
    <div class="page-sub" style="margin-top:4px;">Weekly off (${DB.settings.weeklyOffDay||'—'}) is paid as normal — ${weeklyOffs} day${weeklyOffs===1?'':'s'} this month, not subtracted from the rate.</div>
    ` : `
    <div class="sub-heading" style="margin-top:0;">Madrasa Salary</div>
    <div class="page-sub">Set your monthly salary in Settings to see this.</div>
    `}

    <div class="divider"></div>

    <div class="sub-heading">Private Tutoring Income</div>
    <div class="two-col-item"><span>Collected this month</span><b>${fmtMoney(privateCollected)}</b></div>
    <div class="two-col-item"><span>Still due this month</span><b>${fmtMoney(privateDue)}</b></div>
    ${privatePerDaySoFar!==null? `<div class="two-col-item"><span>Average per day so far</span><b>${fmtMoney(privatePerDaySoFar)}</b></div>` : ''}

    <div class="divider"></div>

    <div class="sub-heading">Batch / Group Income</div>
    <div class="two-col-item"><span>Collected this month</span><b>${fmtMoney(batchCollected)}</b></div>
    <div class="two-col-item"><span>Still due this month</span><b>${fmtMoney(batchDue)}</b></div>
    ${batchPerDaySoFar!==null? `<div class="two-col-item"><span>Average per day so far</span><b>${fmtMoney(batchPerDaySoFar)}</b></div>` : ''}

    ${personalOffsThisMonth.length? `
      <div class="divider"></div>
      <div style="font-size:12px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Personal off days this month (${personalOffsThisMonth.length})</div>
      ${personalOffsThisMonth.map(o=>`
        <div class="two-col-item">
          <span>${o.date}${o.reason?' · '+escapeHTML(o.reason):''}</span>

    ` : ''}
  </div>
  ` : `
  <div class="card">
    <div class="card-title">Income Reference</div>
    <div class="page-sub">Set your monthly salary in Settings to see a per-day rate here.</div>

  ${(DB.sessionLogs&&DB.sessionLogs.length) ? `
  <div class="card">
    <div class="card-title">Session Log — actual time taught</div>
    <div class="hint" style="margin-bottom:10px;">Logged whenever you tapped "Starting early" or "Ended early" on Today's timeline. Scheduled time is untouched — this is just a record of what actually happened.</div>

      const logs = DB.sessionLogs;
      const scheduledMins = logs.map(l=>toMinutes(parseHHMM(l.scheduledEnd))-toMinutes(parseHHMM(l.scheduledStart)));
      const actualMins = logs.map(sessionActualMinutes);

    <div class="sub-heading" style="margin-top:14px;">By Student</div>
    ${(()=>{
      const byStudent = {};
      DB.sessionLogs.forEach(l=>{
        const key = l.studentId || '__unlinked__';

        byStudent[key].push(l);

      return Object.entries(byStudent).map(([sid, logs])=>{
        const st = sid!=='__unlinked__' ? studentById(sid) : null;
        const mins = logs.map(sessionActualMinutes);
        const total = mins.reduce((a,b)=>a+b,0);

        return `<div class="two-col-item">
          <span>${st?escapeHTML(st.name):'(unlinked block)'} · ${logs.length} session${logs.length===1?'':'s'}</span>

      <div class="chev">›</div>
    </div>`;
  }).join('')}
  </div>
  `;
}

      }

  if(sheetsSaveBtn) sheetsSaveBtn.addEventListener('click', ()=>{
    DB.settings.sheetsWebAppUrl = view.querySelector('#setSheetsUrl').value.trim();
    DB.settings.sheetsAutoBackup = view.querySelector('#setSheetsAuto').checked;
    saveDB(); render(); toast('Saved');
  });

  if(sheetsBackupNowBtn) sheetsBackupNowBtn.addEventListener('click', ()=>pushToSheets(false));

  if(sheetsRestoreBtn) sheetsRestoreBtn.addEventListener('click', restoreFromSheets);
}
function exportBackup(){
  downloadBackupFile();
  toast('Backup exported');
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.students)){
        throw new Error('Not a valid backup file');
      }
      if(!confirm('This will replace all current data with the backup. Continue?')) return;
      DB = mergeIntoDefaults(parsed); // same merge path as normal load — new fields fall back to defaults, nothing dropped
      saveDB();
      navigate('dashboard');
      toast('Backup restored');
    }catch(err){
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = ''; // allow re-selecting the same file next time
}

  root.innerHTML = `

      <div class="modal-sheet ${opts.center?'center':''}" id="modalSheet">${innerHTML}</div>

  const closeBtn = root.querySelector('.modal-close');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  if(opts.onMount) opts.onMount(root);
}

  const s = id ? studentById(id) : null;

  const subjectsChecked = s ? (s.subjects||[]) : (presetBatch ? (presetBatch.subjects||[]) : []);
  openModal(`

        <select id="f_type">
          ${[['madrasa','Madrasa student'],['batch','Batch'],['private','Private student']].map(([v,l])=>`<option value="${v}" ${(s?s.type===v:(presetBatchId?v==='private':v==='private'))?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Class</label><input id="f_class" value="${s?escapeHTML(s.class||''):''}"></div>
    </div>
    <div class="field"><label>School / Madrasa</label><input id="f_school" value="${s?escapeHTML(s.school||''):''}"></div>
    ${(()=>{
      const isThisAGroup = s ? s.isGroup===true : false;
      if(isThisAGroup) return ''; // a group can't itself be a member of another group
      return `
      <div class="field"><label><input type="checkbox" id="f_isGroup" ${isThisAGroup?'checked':''} style="width:auto;margin-right:6px;">This is a group (batch, madrasa class, etc.) — not one individual student</label>
        <div class="hint">Use this for any group you teach together — a private tutoring batch, or one class within the madrasa. It becomes a container: you can add real students under it, each with their own fee/attendance, without the group itself counting toward your student headcount.</div>
      </div>`;
    })()}
    ${(()=>{
      const groups = DB.students.filter(x=>x.isGroup===true && (!s||x.id!==s.id));
      if(groups.length===0 || (s&&s.isGroup===true)) return '';
      return `
      <div class="field"><label>Part of a group? (optional)</label>
        <select id="f_batchId">
          <option value="">— not part of a group —</option>
          ${groups.map(b=>`<option value="${b.id}" ${(s&&s.batchId===b.id)||(!s&&presetBatchId===b.id)?'selected':''}>${escapeHTML(b.name)}</option>`).join('')}
        </select>
        <div class="hint">Class records taught to the whole group will show up automatically for this student too — their own fee, attendance, and progress still stay separate.</div>
      </div>`;
    })()}
    ${DB.students.length? `
    <div class="field"><label>Copy subjects from another student (optional)</label>
      <select id="f_copyFrom">
        <option value="">— don't copy —</option>
        ${DB.students.filter(x=>!s||x.id!==s.id).map(x=>`<option value="${x.id}">${escapeHTML(x.name)} (${x.subjects&&x.subjects.length?x.subjects.length+' subjects':'no subjects'})</option>`).join('')}
      </select>
      <div class="hint">Handy when several students share the same subjects — e.g. two Class 9 private students.</div>
    </div>` : ''}
    <div class="field"><label>Subjects</label>
      <div class="chip-select" id="f_subjects">
        ${DB.subjects.map(sub=>`<span class="chip ${subjectsChecked.includes(sub)?'on':''}" data-chip="${escapeHTML(sub)}">${escapeHTML(sub)}</span>`).join('')}
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Guardian name</label><input id="f_gname" value="${s?escapeHTML(s.guardianName||''):''}"></div>
      <div class="field"><label>Guardian phone</label><input id="f_gphone" value="${s?escapeHTML(s.guardianPhone||''):''}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Area</label><input id="f_area" value="${s?escapeHTML(s.area||''):''}"></div>
      <div class="field"><label>Monthly fee (৳)</label><input id="f_fee" type="number" value="${s?s.monthlyFee||'':''}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes">${s?escapeHTML(s.notes||''):''}</textarea></div>
    ${s? `<div class="field"><label><input type="checkbox" id="f_active" ${s.active!==false?'checked':''} style="width:auto;margin-right:6px;">Active</label></div>`:''}
    <div class="modal-actions">
      ${s?`<button class="btn danger" id="delStudentBtn">Delete</button>`:''}
      <button class="btn primary" id="saveStudentBtn">Save</button>
    </div>
  `, {onMount:(root)=>{
    root.querySelectorAll('[data-chip]').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('on')));
    const copyFrom = root.querySelector('#f_copyFrom');
    if(copyFrom) copyFrom.addEventListener('change', ()=>{
      const src = studentById(copyFrom.value);
      if(!src) return;
      root.querySelectorAll('[data-chip]').forEach(chip=>{
        chip.classList.toggle('on', (src.subjects||[]).includes(chip.dataset.chip));
      });
      toast(`Copied ${src.name}'s subjects — review before saving`);
    });
    // Mutual exclusivity: an entity can't simultaneously BE a group container
    // AND be a MEMBER of another group. Live-toggle so this can't be set up
    // by accident, which is what caused the "member's data disappeared" bug.
    const isGroupCheckbox = root.querySelector('#f_isGroup');
    const batchIdSelect = root.querySelector('#f_batchId');
    if(isGroupCheckbox && batchIdSelect){
      isGroupCheckbox.addEventListener('change', ()=>{
        if(isGroupCheckbox.checked){ batchIdSelect.value=''; batchIdSelect.disabled=true; }
        else{ batchIdSelect.disabled=false; }
      });
      batchIdSelect.addEventListener('change', ()=>{
        if(batchIdSelect.value){ isGroupCheckbox.checked=false; isGroupCheckbox.disabled=true; }
        else{ isGroupCheckbox.disabled=false; }
      });
      if(isGroupCheckbox.checked) batchIdSelect.disabled=true;
      if(batchIdSelect.value) isGroupCheckbox.disabled=true;
    }
    root.querySelector('#saveStudentBtn').addEventListener('click',()=>{
      const name = root.querySelector('#f_name').value.trim();
      if(!name){ alert('Name is required'); return; }
      const subjects = Array.from(root.querySelectorAll('[data-chip].on')).map(c=>c.dataset.chip);
      const batchField = root.querySelector('#f_batchId');
      const isGroupField = root.querySelector('#f_isGroup');
      let isGroupVal = isGroupField ? isGroupField.checked : (s?s.isGroup===true:false);
      let batchIdVal = batchField ? (batchField.value || null) : (s?s.batchId:null);
      if(isGroupVal) batchIdVal = null; // defensive: never both at once, regardless of UI state
      const data = {
        name, type: root.querySelector('#f_type').value, class: root.querySelector('#f_class').value.trim(),
        school: root.querySelector('#f_school').value.trim(), subjects,
        isGroup: isGroupVal,
        batchId: batchIdVal,
        guardianName: root.querySelector('#f_gname').value.trim(), guardianPhone: root.querySelector('#f_gphone').value.trim(),
        area: root.querySelector('#f_area').value.trim(), monthlyFee: Number(root.querySelector('#f_fee').value)||0,
        notes: root.querySelector('#f_notes').value.trim()
      };
      if(s){
        Object.assign(s, data);
        s.active = root.querySelector('#f_active') ? root.querySelector('#f_active').checked : true;
      }else{
        DB.students.push(Object.assign({id:uid('stu'), joiningDate:todayISO(), active:true, createdAt:new Date().toISOString()}, data));
      }
      saveDB(); closeModal(); render(); toast('Saved');
    });
    const del = root.querySelector('#delStudentBtn');
    if(del) del.addEventListener('click',()=>{
      if(confirm(`Delete ${s.name}? This does not delete their class records, but they will be orphaned.`)){
        DB.students = DB.students.filter(x=>x.id!==s.id); saveDB(); closeModal(); navigate('students'); toast('Student deleted');
      }
    });
  }});
}

      <div class="field"><label>Homework due</label><input type="date" id="br_hwdue"></div>
    </div>
    <div class="field"><label>Next class topic (whole group)</label><input id="br_next" placeholder="Q13–20"></div>
    <div class="field"><label>Teacher note (optional)</label><textarea id="br_note"></textarea></div>

    ${members.length? `
    <div class="sub-heading">Attendance</div>
    <div class="list" id="br_attList">
      ${members.map(m=>`
        <div class="item" data-member-att="${m.id}">
          <div class="body"><div class="title">${escapeHTML(m.name)}</div></div>
          <div style="display:flex;gap:6px;">
            ${['Present','Absent','Late','Cancelled'].map(st=>`<button type="button" class="btn sm ${st==='Present'?'primary':''}" data-att-choice="${m.id}|${st}">${st[0]}</button>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
    <div class="hint" style="margin:-4px 0 14px;">Defaults to Present for everyone — tap to change just the ones who weren't.</div>

    <div class="sub-heading">Personal Override (optional)</div>
    <div class="hint" style="margin-top:-4px;">Only fill this in for a student who needs different homework or a different next topic than the rest of the group.</div>
    <div id="br_overrideList">
      ${members.map(m=>`
        <div class="field" style="margin-top:10px;">
          <label>${escapeHTML(m.name)} — different homework/next topic?</label>
          <input data-override-hw="${m.id}" placeholder="Leave blank to use the group's homework">
        </div>
      `).join('')}
    </div>
    ` : `<div class="hint">No members added to this batch yet — add members from the batch's Overview tab so you can track attendance and progress per student.</div>`}

    <div class="modal-actions"><button class="btn primary block" id="br_saveBtn">Save Class Record</button></div>
  `,{onMount:(root)=>{
    // attendance choice buttons — one active per member, default Present
    const attState = {};
    members.forEach(m=>attState[m.id]='Present');
    root.querySelectorAll('[data-att-choice]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const [mid, status] = btn.dataset.attChoice.split('|');
        attState[mid] = status;
        root.querySelectorAll(`[data-att-choice^="${mid}|"]`).forEach(b=>b.classList.remove('primary'));
        btn.classList.add('primary');
      });
    });

    root.querySelector('#br_saveBtn').addEventListener('click',()=>{
      const subject = root.querySelector('#br_subject').value;
      const date = root.querySelector('#br_date').value || todayISO();
      const homework = root.querySelector('#br_hw').value.trim();
      const homeworkDeadline = root.querySelector('#br_hwdue').value||'';
      const nextTopic = root.querySelector('#br_next').value.trim();

      const rec = {
        id: uid('rec'), studentId: batchId, subject, date,
        chapter: root.querySelector('#br_chapter').value.trim(), topic: root.querySelector('#br_topic').value.trim(),
        page: root.querySelector('#br_page').value.trim(), completed: root.querySelector('#br_completed').value.trim(),
        homework, homeworkDeadline, understanding:'', weakness:'',
        nextTopic, note: root.querySelector('#br_note').value.trim(),
        createdAt: new Date().toISOString()
      };
      DB.classRecords.push(rec);

      members.forEach(m=>{
        // attendance — per member, from the tap state above
        upsertAttendance(m.id, date, attState[m.id]||'Present');

        // homework — one entry per member so their individual Homework tab and
        // the Dashboard's pending-homework count both pick it up correctly
        if(homework){
          DB.homework.push({id:uid('hw'), studentId:m.id, subject, homework, givenDate:date, dueDate:homeworkDeadline||date, status:'Pending', classRecordId:rec.id});
        }

        // personal override — creates a SEPARATE class record just for this
        // member, which then takes precedence over the shared one when their
        // own "last stopping point" is looked up.
        const overrideInput = root.querySelector(`[data-override-hw="${m.id}"]`);
        const overrideText = overrideInput ? overrideInput.value.trim() : '';
        if(overrideText){
          const personalRec = {
            id: uid('rec'), studentId:m.id, subject, date,
            chapter: rec.chapter, topic: rec.topic, page: rec.page, completed: rec.completed,
            homework: overrideText, homeworkDeadline, understanding:'', weakness:'',
            nextTopic: overrideText, note: `Personal note (batch: ${batch.name})`,
            createdAt: new Date().toISOString()
          };
          DB.classRecords.push(personalRec);
          DB.homework.push({id:uid('hw'), studentId:m.id, subject, homework:overrideText, givenDate:date, dueDate:homeworkDeadline||date, status:'Pending', classRecordId:personalRec.id});
        }
      });

      saveDB(); closeModal(); navigate('studentDetail',{id:batchId,tab:'overview'}); toast('Class record saved for the whole batch');
    });
  }});
}

/* ---------- Flexible payment form — supports advance payments (future months) ---------- */
function openPaymentForm(studentId){
  const s = studentById(studentId);
  const thisMonth = todayISO().slice(0,7);
  openModal(`
    ${modalHead('Record Payment — '+escapeHTML(s.name))}
    <div class="field"><label>Month</label><input type="month" id="p_month" value="${thisMonth}"></div>
    <div class="hint" style="margin:-6px 0 12px;">Pick a future month to record an advance payment.</div>
    <div class="field"><label>Amount (৳)</label><input type="number" id="p_amount" value="${s.monthlyFee||0}"></div>
    <div class="grid2">
      <div class="field"><label>Payment date</label><input type="date" id="p_date" value="${todayISO()}"></div>
      <div class="field"><label>Method</label><select id="p_method">${['Cash','bKash','Nagad','Bank','Other'].map(m=>`<option>${m}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Notes (optional)</label><input id="p_notes"></div>
    <div class="modal-actions"><button class="btn primary block" id="p_saveBtn">Record Payment</button></div>
  `,{onMount:(root)=>{
    root.querySelector('#p_saveBtn').addEventListener('click',()=>{
      const month = root.querySelector('#p_month').value;
      const amount = Number(root.querySelector('#p_amount').value)||0;
      if(!month || amount<=0){ alert('Enter a valid month and amount'); return; }
      let f = DB.fees.find(x=>x.studentId===studentId && x.month===month);
      if(!f){ f={id:uid('fee'), studentId, month, monthlyFee:s.monthlyFee, paid:0, paymentDate:null, method:'Cash', notes:''}; DB.fees.push(f); }
      // Adds to any existing amount for that month, so partial installments (or an
      // advance on top of an already-paid month) accumulate rather than overwrite.
      f.paid = Number(f.paid||0) + amount;
      f.paymentDate = root.querySelector('#p_date').value || todayISO();
      f.method = root.querySelector('#p_method').value;
      const note = root.querySelector('#p_notes').value.trim();
      if(note) f.notes = f.notes ? f.notes+' · '+note : note;
      saveDB(); closeModal(); render();
      const isFuture = month > thisMonth;
      toast(isFuture ? `Advance payment recorded for ${monthLabel(month)}` : 'Payment recorded');
    });
  }});
}

}

function openCopySyllabusForm(studentId){
  const target = studentById(studentId);
  const sources = DB.students.filter(x=>x.id!==studentId && DB.syllabus.some(sy=>sy.studentId===x.id));
  if(sources.length===0){ toast('No other student has syllabus items to copy yet'); return; }
  openModal(`
    ${modalHead('Copy Syllabus From')}
    <div class="field"><label>Source student</label>
      <select id="cs_source">${sources.map(x=>`<option value="${x.id}">${escapeHTML(x.name)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Subjects to copy</label>
      <div class="chip-select" id="cs_subjects"></div>
      <div class="hint">Progress status resets to "Not Started" for ${escapeHTML(target.name)} — the chapter/topic list is shared, not the completion state.</div>
    </div>
    <div class="modal-actions"><button class="btn primary block" id="cs_saveBtn">Copy Selected</button></div>
  `,{onMount:(root)=>{
    function renderSubjectChips(){
      const srcId = root.querySelector('#cs_source').value;
      const subjs = [...new Set(DB.syllabus.filter(sy=>sy.studentId===srcId).map(sy=>sy.subject))];
      root.querySelector('#cs_subjects').innerHTML = subjs.map(sub=>`<span class="chip on" data-chip="${escapeHTML(sub)}">${escapeHTML(sub)}</span>`).join('');
      root.querySelectorAll('[data-chip]').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('on')));
    }
    root.querySelector('#cs_source').addEventListener('change', renderSubjectChips);
    renderSubjectChips();
    root.querySelector('#cs_saveBtn').addEventListener('click',()=>{
      const srcId = root.querySelector('#cs_source').value;
      const chosenSubjects = Array.from(root.querySelectorAll('[data-chip].on')).map(c=>c.dataset.chip);
      if(chosenSubjects.length===0){ alert('Pick at least one subject'); return; }
      let count=0;
      chosenSubjects.forEach(subj=>{
        if(!target.subjects.includes(subj)) target.subjects.push(subj);
        DB.syllabus.filter(sy=>sy.studentId===srcId && sy.subject===subj).forEach(sy=>{
          DB.syllabus.push({id:uid('syl'), studentId, subject:subj, chapter:sy.chapter, topic:sy.topic, status:'Not Started'});
          count++;
        });
      });
      saveDB(); closeModal(); render(); toast(`Copied ${count} item${count===1?'':'s'}`);
    });
  }});
}

/* ---------- Study plan entry form ---------- */
/* ---------- Weekly plan — one student, all 7 days at once. Subject/topic
   pre-fill from that student's last class record's "next topic" wherever
   available, so most days need at most a tap-to-confirm rather than typing. ---------- */
function openWeeklyPlanForm(presetStudentName){
  DB.studyPlan = DB.studyPlan || [];
  if(DB.students.length===0){ toast('Add a student first'); return; }
  const startName = presetStudentName || DB.students[0].name;

  openModal(`
    ${modalHead('Plan a Week')}
    <div class="field"><label>Student/Batch</label>
      <select id="wp_student">${DB.students.map(s=>`<option value="${escapeHTML(s.name)}" ${s.name===startName?'selected':''}>${escapeHTML(s.name)}</option>`).join('')}</select>
    </div>
    <div id="wp_days"></div>
    <div class="hint" style="margin-bottom:14px;">"+ Add subject" if a day needs more than one — e.g. Math and English the same day. Saving replaces this student's whole week with what's shown here.</div>
    <div class="modal-actions"><button class="btn primary block" id="wp_saveBtn">Save Week</button></div>
  `,{onMount:(root)=>{
    function studentSubjects(name){
      const student = DB.students.find(x=>x.name===name);
      return (student && student.subjects && student.subjects.length) ? student.subjects : DB.subjects;
    }
    function suggestTopic(name, subject){
      const student = DB.students.find(x=>x.name===name);
      if(!student || !subject) return '';
      const rec = lastClassRecord(student.id, subject);
      return rec && rec.nextTopic ? rec.nextTopic : '';
    }
    function subjectOptionsHTML(studentName, selected){
      const subjects = studentSubjects(studentName);
      return `<option value="">— skip —</option>` +
        subjects.map(sub=>`<option value="${escapeHTML(sub)}" ${selected===sub?'selected':''}>${escapeHTML(sub)}</option>`).join('');
    }
    function makeRow(studentName, subject, topic){
      const row = document.createElement('div');
      row.className = 'grid2';
      row.dataset.row = '1';
      row.style.marginBottom = '6px';
      row.innerHTML = `
        <select data-row-subject>${subjectOptionsHTML(studentName, subject||'')}</select>
        <div style="display:flex;gap:6px;">
          <input data-row-topic placeholder="Topic" value="${topic?escapeHTML(topic):''}" style="flex:1;">
          <button type="button" class="btn sm ghost" data-remove-row style="flex:none;">✕</button>
        </div>`;
      row.querySelector('[data-row-subject]').addEventListener('change', (e)=>{
        const topicInput = row.querySelector('[data-row-topic]');
        if(e.target.value){
          const suggestion = suggestTopic(root.querySelector('#wp_student').value, e.target.value);
          if(suggestion) topicInput.value = suggestion;
        }
      });
      row.querySelector('[data-remove-row]').addEventListener('click', ()=>row.remove());
      return row;
    }
    function renderDayRows(studentName){
      const existing = (DB.studyPlan||[]).filter(p=>p.student===studentName);
      root.querySelector('#wp_days').innerHTML = WEEKDAYS.map(day=>`
        <div class="field" data-day-block="${day}">
          <label>${day}</label>
          <div data-rows-container="${day}"></div>
          <button type="button" class="btn sm ghost" data-add-row="${day}" style="margin-top:2px;">+ Add subject</button>
        </div>`).join('');
      WEEKDAYS.forEach(day=>{
        const container = root.querySelector(`[data-rows-container="${day}"]`);
        const dayEntries = existing.filter(p=>p.day===day);
        const rowsToMake = dayEntries.length ? dayEntries : [null]; // always show at least one blank row
        rowsToMake.forEach(entry=>{
          container.appendChild(makeRow(studentName, entry?entry.subject:'', entry?entry.topic:''));
        });
      });
      root.querySelectorAll('[data-add-row]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const container = root.querySelector(`[data-rows-container="${btn.dataset.addRow}"]`);
          container.appendChild(makeRow(root.querySelector('#wp_student').value, '', ''));
        });
      });
    }
    renderDayRows(startName);
    root.querySelector('#wp_student').addEventListener('change', (e)=>renderDayRows(e.target.value));

    root.querySelector('#wp_saveBtn').addEventListener('click',()=>{
      const studentName = root.querySelector('#wp_student').value;
      DB.studyPlan = (DB.studyPlan||[]).filter(p=>p.student!==studentName); // full-week replace, idempotent re-planning
      let count=0;
      WEEKDAYS.forEach(day=>{
        const container = root.querySelector(`[data-rows-container="${day}"]`);
        container.querySelectorAll('[data-row]').forEach(row=>{
          const subj = row.querySelector('[data-row-subject]').value;
          const topic = row.querySelector('[data-row-topic]').value.trim();
          if(subj){
            DB.studyPlan.push({id:uid('plan'), day, student:studentName, subject:subj, topic});
            count++;
          }
        });
      });
      saveDB(); closeModal(); render();
      toast(count>0 ? `Week planned for ${studentName} (${count} entr${count===1?'y':'ies'})` : `Cleared ${studentName}'s week`);
    });
  }});
}

/* =========================================================================
   GLOBAL SEARCH
   ========================================================================= */
function runSearch(q){
  q = q.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  if(!q){ resultsEl.style.display='none'; resultsEl.innerHTML=''; return; }
  const groups = [];

  const students = DB.students.filter(s=>s.name.toLowerCase().includes(q));
  if(students.length) groups.push(['Students', students.map(s=>({label:s.name+' — '+typeLabel(s.type), go:()=>navigate('studentDetail',{id:s.id})}))]);

  const subjects = DB.subjects.filter(s=>s.toLowerCase().includes(q));
  if(subjects.length) groups.push(['Subjects', subjects.map(s=>({label:s, go:()=>navigate('settings')}))]);

  const recs = DB.classRecords.filter(r=>(r.subject+' '+r.chapter+' '+r.topic+' '+r.note).toLowerCase().includes(q));
  if(recs.length) groups.push(['Class Records', recs.slice(0,8).map(r=>{ const st=studentById(r.studentId); return {label:`${st?st.name:'?'} · ${r.subject} · ${r.date}`, go:()=>navigate('studentDetail',{id:r.studentId,tab:'records'})}; })]);

  const exams = DB.exams.filter(e=>(e.name+' '+e.subject).toLowerCase().includes(q));
  if(exams.length) groups.push(['Exams', exams.slice(0,8).map(e=>{ const st=studentById(e.studentId); return {label:`${e.name} — ${st?st.name:'?'}`, go:()=>navigate('studentDetail',{id:e.studentId,tab:'exams'})}; })]);

  const hw = DB.homework.filter(h=>(h.subject+' '+h.homework).toLowerCase().includes(q));
  if(hw.length) groups.push(['Homework', hw.slice(0,8).map(h=>{ const st=studentById(h.studentId); return {label:`${st?st.name:'?'} · ${h.subject}: ${h.homework}`, go:()=>navigate('studentDetail',{id:h.studentId,tab:'homework'})}; })]);

  if(groups.length===0){ resultsEl.style.display='block'; resultsEl.innerHTML = `<div class="sr-item">No results for "${escapeHTML(q)}"</div>`; return; }

  resultsEl.style.display='block';
  resultsEl.innerHTML = groups.map(([cat,items])=>items.map((it,i)=>`
    <div class="sr-item" data-sr="${cat}-${i}">${i===0?`<div class="sr-cat">${cat}</div>`:''}${escapeHTML(it.label)}</div>
  `).join('')).join('');

  let flatIdx=0;
  groups.forEach(([cat,items])=>items.forEach(it=>{
    const el = resultsEl.querySelector(`[data-sr="${cat}-${items.indexOf(it)}"]`);
    if(el) el.addEventListener('click', ()=>{ it.go(); document.getElementById('searchBar').style.display='none'; resultsEl.style.display='none'; document.getElementById('searchInput').value=''; });
  }));
}

// standalone/full-screen install on Android). Fails silently on file:// or if

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
