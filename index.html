<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teacher Planner — Asif National</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1319; --bg2:#141a22; --card:#1a212b; --card2:#1f2733;
  --line:#293241; --line2:#33404f;
  --ink:#eef2f6; --ink-dim:#a9b4c2; --ink-faint:#6b7787;
  --amber:#e0a458; --amber-soft:#f0c98a; --teal:#5fb9a8; --blue:#6fa3d8;
  --ok:#7fbf8a; --warn:#e0a458; --err:#e07a6f;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{min-height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh;
  padding-bottom:78px;
  font-size:14px; line-height:1.45;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
button{cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(15,19,25,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;flex-direction:column;}
.brand .eyebrow{font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
.brand h1{font-size:19px;color:var(--ink);}
.topbar-actions{display:flex;gap:8px;}
.icon-btn{
  background:var(--card2);border:1px solid var(--line2);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--ink-dim);
}
.icon-btn:active{background:var(--line2);}

.search-bar{margin-top:10px;position:relative;}
.search-bar input{
  width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:11px;
  padding:10px 12px 10px 34px;color:var(--ink);
}
.search-bar::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:0.5;}
.search-results{
  margin-top:8px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;
  max-height:340px;overflow-y:auto;
}
.search-results .sr-item{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.search-results .sr-item:last-child{border-bottom:none;}
.sr-cat{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--amber-soft);font-weight:700;margin-bottom:2px;}

/* ---------- Main ---------- */
main{padding:16px;max-width:560px;margin:0 auto;}
.page-title{font-size:20px;margin-bottom:4px;}
.page-sub{color:var(--ink-faint);font-size:12.5px;margin-bottom:16px;}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-faint);font-weight:700;margin-bottom:10px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;}
.stat .num{font-family:'Fraunces',serif;font-size:22px;color:var(--ink);}
.stat .lbl{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.stat.hot{border-color:rgba(224,164,88,0.4);background:linear-gradient(160deg,rgba(224,164,88,0.12),transparent);}
.stat.hot .num{color:var(--amber-soft);}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;}
.badge.ok{background:rgba(127,191,138,0.14);color:var(--ok);}
.badge.warn{background:rgba(224,164,88,0.14);color:var(--amber-soft);}
.badge.err{background:rgba(224,122,111,0.14);color:var(--err);}
.badge.muted{background:var(--card2);color:var(--ink-faint);}

.btn{
  border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{background:var(--line2);}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206;}
.btn.primary:active{background:var(--amber-soft);}
.btn.ghost{background:transparent;}
.btn.danger{border-color:rgba(224,122,111,0.5);color:var(--err);background:transparent;}
.btn.block{width:100%;}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:8px;}

.list{display:flex;flex-direction:column;gap:10px;}
.item{
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;
}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.item .body{flex:1;min-width:0;}
.item .title{font-weight:600;font-size:14px;}
.item .meta{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.chev{color:var(--ink-faint);font-size:16px;}

.timeline-item{
  display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);
}
.timeline-item:last-child{border-bottom:none;}
.timeline-item.now{background:linear-gradient(90deg,rgba(224,164,88,0.10),transparent);border-radius:10px;margin:0 -6px;padding:13px 10px;}
.timeline-item .t{width:78px;flex:none;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;padding-top:1px;}
.timeline-item.now .t{color:var(--amber-soft);font-weight:700;}
.timeline-item .tbody{flex:1;}
.timeline-item .ttitle{font-weight:600;font-size:14px;}
.timeline-item .tnote{font-size:12px;color:var(--ink-faint);margin-top:2px;}

.empty{
  text-align:center;padding:34px 16px;color:var(--ink-faint);
}
.empty .big{font-size:28px;margin-bottom:8px;}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.tab{
  flex:none;background:var(--card2);border:1px solid var(--line2);color:var(--ink-dim);
  padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;
}
.tab.active{background:var(--amber);border-color:var(--amber);color:#1a1206;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:10px;
  padding:10px 12px;color:var(--ink);color-scheme:dark;
}
.field textarea{min-height:64px;resize:vertical;}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.chip-select{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:7px 12px;font-size:12.5px;color:var(--ink-dim);
}
.chip.on{background:rgba(224,164,88,0.16);border-color:var(--amber);color:var(--amber-soft);font-weight:600;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(15,19,25,0.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-faint);padding:6px 2px;border-radius:10px;
  font-size:9.5px;font-weight:700;letter-spacing:0.02em;
}
.navbtn .ic{font-size:17px;}
.navbtn.active{color:var(--amber-soft);}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--bg2);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
.modal-sheet.center{
  border-radius:16px;border-bottom:1px solid var(--line);max-width:420px;margin:auto;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h2{font-size:17px;}
.modal-close{background:var(--card2);border:1px solid var(--line2);border-radius:10px;width:32px;height:32px;color:var(--ink-dim);font-size:15px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions .btn{flex:1;}

.toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line2);color:var(--ink);
  padding:10px 16px;border-radius:24px;font-size:13px;font-weight:600;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}

.divider{height:1px;background:var(--line);margin:14px 0;}
.sub-heading{font-size:11px;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-faint);font-weight:700;margin:16px 0 8px;}
.progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-bar > div{height:100%;background:var(--teal);}
.two-col-item{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);}
.two-col-item:last-child{border-bottom:none;}
.stopblock{
  background:linear-gradient(160deg,rgba(224,164,88,0.12),rgba(224,164,88,0.02));
  border:1px solid rgba(224,164,88,0.32);border-radius:12px;padding:12px 14px;margin-bottom:10px;
}
.stopblock .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--amber-soft);font-weight:700;}
.stopblock .val{font-size:13.5px;margin-top:3px;color:var(--ink);}

@media (min-width:640px){
  .bottomnav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0;border-left:1px solid var(--line);border-right:1px solid var(--line);}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="eyebrow" id="brandEyebrow">Asif National</div>
      <h1 id="pageHeading">Dashboard</h1>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="searchToggleBtn" title="Search">🔍</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>
  </div>
  <div class="search-bar" id="searchBar" style="display:none;">
    <input type="text" id="searchInput" placeholder="Search students, subjects, records…">
    <div class="search-results" id="searchResults" style="display:none;"></div>
  </div>
</div>

<main id="view"></main>

<div class="bottomnav" id="bottomNav"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================================
   TEACHER PLANNER — core.js (storage, ids, time/date, prayer service)
   ========================================================================= */
const TZ = 'Asia/Dhaka';
const DB_KEY = 'tp_db_v1';
const SUBJECT_DEFAULTS = ['Bangla','English','English 1st Paper','English 2nd Paper','Math','Physics','Chemistry','Biology','Science','Social Science','General Knowledge','Spoken English','মাশক','Other'];

function uid(prefix){
  const rand = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2));
  return (prefix?prefix+'_':'') + rand;
}

function defaultDB(){
  return {
    version:1,
    settings:{
      teacherName:'Md. Asif Khan',
      brand:'Asif National',
      location:'Rajshahi, Bangladesh',
      timezone: TZ,
      city:'Rajshahi', country:'Bangladesh', prayerMethod:1,
      theme:'dark',
      onboarded:false
    },
    students:[],      // {id,name,nickname,type:'madrasa'|'batch'|'private',class,school,guardianName,guardianPhone,area,subjects:[],monthlyFee,joiningDate,active,notes,createdAt}
    subjects:[...SUBJECT_DEFAULTS],
    classRecords:[],  // {id,studentId,subject,date,chapter,topic,page,completed,homework,homeworkDeadline,understanding,weakness,nextTopic,note,createdAt}
    homework:[],      // {id,studentId,subject,homework,givenDate,dueDate,status,classRecordId}
    attendance:[],    // {id,studentId,date,status}
    exams:[],         // {id,name,studentId,subject,chapter,date,total,obtained,notes}
    fees:[],          // {id,studentId,month,monthlyFee,paid,paymentDate,method,notes}
    tasks:[],         // {id,title,date,priority,completed,notes}
    syllabus:[],      // {id,studentId,subject,chapter,topic,status}
    prayerTimes:{}     // { 'YYYY-MM-DD': {location,maghrib,fetchedAt} }
  };
}

let DB = loadDB();

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    // shallow-merge to survive schema additions across versions
    const base = defaultDB();
    return Object.assign(base, parsed, {
      settings: Object.assign(base.settings, parsed.settings||{})
    });
  }catch(e){
    console.error('DB load failed, starting fresh', e);
    return defaultDB();
  }
}
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){
    console.error('DB save failed', e);
    toast('⚠ Could not save — storage may be full');
  }
}

/* ---------------- date / time helpers (Asia/Dhaka authoritative) ---------------- */
function todayISO(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
}
function nowDhakaParts(){
  const fmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
  const parts = fmt.formatToParts(new Date());
  const h = parseInt(parts.find(p=>p.type==='hour').value,10);
  const m = parseInt(parts.find(p=>p.type==='minute').value,10);
  return {h,m};
}
function nowMinutes(){ const {h,m}=nowDhakaParts(); return h*60+m; }
function readableDate(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);
}
function weekdayShort(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short'}).format(d);
}
function parseHHMM(raw){
  if(!raw) return null;
  const m = /^(\d{1,2}):(\d{2})/.exec(String(raw).trim());
  if(!m) return null;
  const h=parseInt(m[1],10), mi=parseInt(m[2],10);
  if(h<0||h>23||mi<0||mi>59) return null;
  return {h,m:mi};
}
function toMinutes(t){ return t.h*60+t.m; }
function fromMinutes(mins){ mins=((mins%1440)+1440)%1440; return {h:Math.floor(mins/60), m:mins%60}; }
function addMinutes(t,mins){ return fromMinutes(toMinutes(t)+mins); }
function fmt12(t){ if(!t) return '—'; const period=t.h>=12?'PM':'AM'; let h12=t.h%12; if(h12===0)h12=12; return `${h12}:${String(t.m).padStart(2,'0')} ${period}`; }
function fmt24(t){ return `${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}`; }
function fmtMoney(n){ n = Number(n)||0; return '৳' + n.toLocaleString('en-IN'); }

/* =========================================================================
   PRAYER SERVICE — isolated, replaceable. AlAdhan public API, no key needed.
   ========================================================================= */
const PrayerService = (function(){
  function apiDate(iso){ const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }

  async function fetchPrayerTimes(iso){
    const { city, country, prayerMethod } = DB.settings;
    const url = `https://api.aladhan.com/v1/timingsByCity/${apiDate(iso)}?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${prayerMethod}`;
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 8000);
    try{
      const res = await fetch(url,{signal:controller.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      if(!json || json.code!==200 || !json.data || !json.data.timings || !json.data.timings.Maghrib){
        throw new Error('Invalid API response');
      }
      const parsed = parseHHMM(json.data.timings.Maghrib);
      if(!parsed) throw new Error('Unparseable Maghrib');
      return { location: `${city}, ${country}`, maghrib: fmt24(parsed), fetchedAt: new Date().toISOString() };
    }catch(e){
      clearTimeout(timer);
      throw e;
    }
  }

  function getCached(iso){ return DB.prayerTimes[iso] || null; }
  function setCached(iso,data){ DB.prayerTimes[iso]=data; saveDB(); }

  /**
   * getMaghribTime(iso, {forceRefresh}) -> { maghrib:'HH:MM'|null, source:'api'|'cache'|null, status:'ok'|'warn'|'err', message:string }
   */
  async function getMaghribTime(iso, opts){
    opts = opts||{};
    const cached = getCached(iso);
    if(!opts.forceRefresh && cached){
      // return cache instantly; caller may still trigger a background refresh
      return { maghrib:cached.maghrib, source:'cache', status:'ok', message:'Loaded from saved prayer time.' };
    }
    try{
      const fresh = await fetchPrayerTimes(iso);
      setCached(iso, fresh);
      return { maghrib:fresh.maghrib, source:'api', status:'ok', message:'Prayer time updated from API.' };
    }catch(e){
      if(cached){
        return { maghrib:cached.maghrib, source:'cache', status:'warn', message:'Using saved prayer time — API unavailable.' };
      }
      return { maghrib:null, source:null, status:'err', message:'Maghrib time unavailable.' };
    }
  }

  return { fetchPrayerTimes, getMaghribTime, getCached };
})();

/* ---------------- toast ---------------- */
let toastTimer=null;
function toast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ root.innerHTML=''; }, 2600);
}

/* =========================================================================
   SCHEDULE SERVICE — fixed madrasa/evening blocks + dynamic Safa slot
   ========================================================================= */
const FIXED_SCHEDULE = [
  {start:'08:00',end:'09:00',title:'1st Period — English / Math',note:'Class 3',type:'madrasa'},
  {start:'09:00',end:'09:30',title:'Spoken English',note:'',type:'madrasa'},
  {start:'09:30',end:'09:50',title:'মাশক',note:'',type:'madrasa'},
  {start:'09:50',end:'10:30',title:'3rd Period — Social Science / Science / GK',note:'Class 3',type:'madrasa'},
  {start:'10:30',end:'10:40',title:'Break',note:'',type:'break'},
  {start:'10:40',end:'11:20',title:'4th Period — Math',note:'Class 2',type:'madrasa'},
  {start:'11:20',end:'12:45',title:'5th Period — Math + Bangla / SS / Science / Kitab',note:'',type:'madrasa'},
  {start:'12:45',end:'13:00',title:'Return home',note:'',type:'transit'},
  {start:'13:00',end:'15:56',title:'Free / Rest Block',note:'Protected — not auto-filled with work',type:'rest'},
  {start:'16:00',end:'17:15',title:"4 o'clock Batch",note:'Class 9 · English, Math',type:'batch',studentMatch:{name:"4 o'clock Batch"}},
  {start:'17:15',end:'18:15',title:'Anika',note:'Class 6 · Private · All subjects',type:'private',studentMatch:{name:'Anika'}},
];

function buildDaySchedule(iso, maghribHHMM){
  const items = FIXED_SCHEDULE.map(s=>({...s, startMin:toMinutes(parseHHMM(s.start)), endMin:toMinutes(parseHHMM(s.end))}));
  let conflict = null;
  if(maghribHHMM){
    const maghrib = parseHHMM(maghribHHMM);
    const gapStart = items.find(i=>i.title.startsWith('Anika')).endMin;
    items.push({start:fmt24(maghrib),end:fmt24(maghrib),title:'Maghrib',note:'Fetched automatically',type:'maghrib',startMin:toMinutes(maghrib),endMin:toMinutes(maghrib)});
    const safaStart = addMinutes(maghrib,20);
    const safaEnd = addMinutes(safaStart,70);
    items.push({start:fmt24(safaStart),end:fmt24(safaEnd),title:'Safa',note:'Class 9 · Private · Maghrib + 20 min',type:'private',studentMatch:{name:'Safa'},startMin:toMinutes(safaStart),endMin:toMinutes(safaEnd)});
    // conflict check: Safa start before Anika ends
    if(toMinutes(safaStart) < gapStart){
      conflict = `Safa's calculated start (${fmt12(safaStart)}) overlaps Anika's class, which ends at ${fmt12(fromMinutes(gapStart))}.`;
    }
  }
  items.sort((a,b)=>a.startMin-b.startMin);
  return {items, conflict};
}

function scheduleStatusFor(item, nowMin){
  if(item.type==='maghrib') return nowMin>=item.startMin && nowMin < item.startMin+1 ? 'now' : (nowMin>item.startMin?'past':'upcoming');
  if(nowMin>=item.startMin && nowMin<item.endMin) return 'now';
  if(nowMin>=item.endMin) return 'past';
  return 'upcoming';
}

/* =========================================================================
   ROUTER + RENDER ENGINE
   ========================================================================= */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'🏠'},
  {id:'today', label:'Today', icon:'🕐'},
  {id:'students', label:'Students', icon:'🎓'},
  {id:'study', label:'Study', icon:'📘'},
  {id:'exams', label:'Exams', icon:'📝'},

/* =========================================================================
   DATA HELPERS (queries across collections)
   ========================================================================= */
function activeStudents(){ return DB.students.filter(s=>s.active!==false); }
function studentById(id){ return DB.students.find(s=>s.id===id); }
function lastClassRecord(studentId, subject){
  const recs = DB.classRecords.filter(r=>r.studentId===studentId && (!subject || r.subject===subject));
  if(recs.length===0) return null;
  return recs.slice().sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0];
}
function pendingHomeworkCount(){ return DB.homework.filter(h=>h.status==='Pending'||h.status==='Late').length; }
function upcomingExams(days){
  const today = todayISO();
  const limit = new Date(today); limit.setDate(limit.getDate()+(days||14));
  const limitISO = limit.toISOString().slice(0,10);
  return DB.exams.filter(e=>e.date>=today && e.date<=limitISO).sort((a,b)=>a.date.localeCompare(b.date));
}
function unpaidFeesCount(monthISO){
  const month = monthISO || todayISO().slice(0,7);
  return activeStudents().filter(s=>s.monthlyFee>0).filter(s=>{
    const f = DB.fees.find(x=>x.studentId===s.id && x.month===month);
    const paid = f? Number(f.paid||0) : 0;
    return paid < Number(s.monthlyFee||0);
  }).length;
}
function feeStatusFor(student, monthISO){
  const month = monthISO || todayISO().slice(0,7);
  const f = DB.fees.find(x=>x.studentId===student.id && x.month===month);
  const expected = Number(student.monthlyFee||0);
  const paid = f? Number(f.paid||0):0;
  const due = Math.max(0, expected-paid);
  let status='Due';
  if(expected===0) status='—';
  else if(paid>=expected && expected>0) status='Paid';
  else if(paid>0) status='Partial';
  return {expected,paid,due,status,record:f};
}
function attendanceStatsFor(studentId){
  const recs = DB.attendance.filter(a=>a.studentId===studentId);
  const present = recs.filter(a=>a.status==='Present').length;
  const absent = recs.filter(a=>a.status==='Absent').length;
  const late = recs.filter(a=>a.status==='Late').length;
  const cancelled = recs.filter(a=>a.status==='Cancelled').length;
  const total = present+absent+late;
  const pct = total>0 ? Math.round(((present+late*0.5)/total)*100) : null;
  return {present,absent,late,cancelled,total,pct};
}
function subjectProgress(studentId, subject){
  const items = DB.syllabus.filter(s=>s.studentId===studentId && s.subject===subject);
  if(items.length===0) return null;
  const done = items.filter(i=>i.status==='Completed').length;
  return Math.round((done/items.length)*100);
}
function examAverage(studentId, subject){
  const list = DB.exams.filter(e=>e.studentId===studentId && (!subject||e.subject===subject));
  if(list.length===0) return null;
  const pct = list.map(e=> e.total>0 ? (e.obtained/e.total*100):0);
  return Math.round(pct.reduce((a,b)=>a+b,0)/pct.length);
}

let dashboardMaghribFetchedFor = null;

function matchStudent(matchObj){

function lastClassRecordAcrossSubjects(studentId){

  return recs.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0];

// Guards which date we've already fetched/are fetching for, so a normal render
// (including the re-render the fetch itself triggers) never re-triggers a fetch.
// Only an explicit date change or the Refresh button forces a new call.
let todayMaghribFetchedFor = null;
function loadMaghribForToday(force){
  if(!force && todayMaghribFetchedFor === todayISOState) return; // already fetched/fetching for this date
  todayMaghribFetchedFor = todayISOState; // mark before awaiting to block duplicate triggers
  todayMaghribInfo = {maghrib:todayMaghribInfo.maghrib, status:'loading', message:'Checking prayer time…'};
  PrayerService.getMaghribTime(todayISOState, {forceRefresh:force}).then(res=>{
    todayMaghribInfo = res;
    if(ROUTE.page==='today') render();
  });
}

function bindToday(){
  loadMaghribForToday(false);
  const view = document.getElementById('view');
  view.querySelector('#todayDatePicker').addEventListener('change', e=>{
    todayISOState = e.target.value || todayISO();
    render();
  });
  view.querySelector('#todayJumpBtn').addEventListener('click', ()=>{
    todayISOState = todayISO();
    render();
  });
  const rf = view.querySelector('#refreshMaghribBtn');

  view.querySelectorAll('[data-open-student]').forEach(el=>{
    el.addEventListener('click',()=>navigate('studentDetail',{id:el.dataset.openStudent}));

}

function suggestForDay(day){
  // lightweight suggestion using most recent class record's nextTopic, so the teacher isn't forced to plan from scratch
  const recent = DB.classRecords.slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt))[0];
  if(recent && recent.nextTopic){
    const st = studentById(recent.studentId);
    return `Suggestion: continue ${st?st.name:''} ${recent.subject} — ${recent.nextTopic}`;
  }
  return '';
}

  document.getElementById('addPlanBtn').addEventListener('click',()=>openPlanForm());

function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `teacher-planner-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exported');
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.students)){
        throw new Error('Not a valid backup file');
      }
      if(!confirm('This will replace all current data with the backup. Continue?')) return;
      DB = Object.assign(defaultDB(), parsed, {settings:Object.assign(defaultDB().settings, parsed.settings||{})});
      saveDB();
      navigate('dashboard');
      toast('Backup restored');
    }catch(err){
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function openModal(innerHTML, opts){

      <div class="modal-sheet ${opts.center?'center':''}" id="modalSheet">${innerHTML}</div>

  const closeBtn = root.querySelector('.modal-close');

  if(opts.onMount) opts.onMount(root);
}

    <div class="grid2">
      <div class="field"><label>Type</label>
        <select id="f_type">
          ${[['madrasa','Madrasa student'],['batch','Batch'],['private','Private student']].map(([v,l])=>`<option value="${v}" ${s&&s.type===v?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Class</label><input id="f_class" value="${s?escapeHTML(s.class||''):''}"></div>
    </div>
    <div class="field"><label>School / Madrasa</label><input id="f_school" value="${s?escapeHTML(s.school||''):''}"></div>
    <div class="field"><label>Subjects</label>
      <div class="chip-select" id="f_subjects">
        ${DB.subjects.map(sub=>`<span class="chip ${subjectsChecked.includes(sub)?'on':''}" data-chip="${escapeHTML(sub)}">${escapeHTML(sub)}</span>`).join('')}
      </div>
    </div>
    <div class="grid2">
      <div class="field"><label>Guardian name</label><input id="f_gname" value="${s?escapeHTML(s.guardianName||''):''}"></div>
      <div class="field"><label>Guardian phone</label><input id="f_gphone" value="${s?escapeHTML(s.guardianPhone||''):''}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Area</label><input id="f_area" value="${s?escapeHTML(s.area||''):''}"></div>
      <div class="field"><label>Monthly fee (৳)</label><input id="f_fee" type="number" value="${s?s.monthlyFee||'':''}"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f_notes">${s?escapeHTML(s.notes||''):''}</textarea></div>
    ${s? `<div class="field"><label><input type="checkbox" id="f_active" ${s.active!==false?'checked':''} style="width:auto;margin-right:6px;">Active</label></div>`:''}
    <div class="modal-actions">
      ${s?`<button class="btn danger" id="delStudentBtn">Delete</button>`:''}
      <button class="btn primary" id="saveStudentBtn">Save</button>
    </div>
  `, {onMount:(root)=>{
    root.querySelectorAll('[data-chip]').forEach(chip=>chip.addEventListener('click',()=>chip.classList.toggle('on')));
    root.querySelector('#saveStudentBtn').addEventListener('click',()=>{
      const name = root.querySelector('#f_name').value.trim();
      if(!name){ alert('Name is required'); return; }
      const subjects = Array.from(root.querySelectorAll('[data-chip].on')).map(c=>c.dataset.chip);
      const data = {
        name, type: root.querySelector('#f_type').value, class: root.querySelector('#f_class').value.trim(),
        school: root.querySelector('#f_school').value.trim(), subjects,
        guardianName: root.querySelector('#f_gname').value.trim(), guardianPhone: root.querySelector('#f_gphone').value.trim(),
        area: root.querySelector('#f_area').value.trim(), monthlyFee: Number(root.querySelector('#f_fee').value)||0,
        notes: root.querySelector('#f_notes').value.trim()
      };
      if(s){
        Object.assign(s, data);
        s.active = root.querySelector('#f_active') ? root.querySelector('#f_active').checked : true;
      }else{
        DB.students.push(Object.assign({id:uid('stu'), joiningDate:todayISO(), active:true, createdAt:new Date().toISOString()}, data));
      }
      saveDB(); closeModal(); render(); toast('Saved');
    });
    const del = root.querySelector('#delStudentBtn');
    if(del) del.addEventListener('click',()=>{
      if(confirm(`Delete ${s.name}? This does not delete their class records, but they will be orphaned.`)){
        DB.students = DB.students.filter(x=>x.id!==s.id); saveDB(); closeModal(); navigate('students'); toast('Student deleted');
      }
    });
  }});
}

/* =========================================================================
   GLOBAL SEARCH
   ========================================================================= */
function runSearch(q){
  q = q.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  if(!q){ resultsEl.style.display='none'; resultsEl.innerHTML=''; return; }
  const groups = [];

  const students = DB.students.filter(s=>s.name.toLowerCase().includes(q));
  if(students.length) groups.push(['Students', students.map(s=>({label:s.name+' — '+typeLabel(s.type), go:()=>navigate('studentDetail',{id:s.id})}))]);

  const subjects = DB.subjects.filter(s=>s.toLowerCase().includes(q));
  if(subjects.length) groups.push(['Subjects', subjects.map(s=>({label:s, go:()=>navigate('settings')}))]);

  const recs = DB.classRecords.filter(r=>(r.subject+' '+r.chapter+' '+r.topic+' '+r.note).toLowerCase().includes(q));
  if(recs.length) groups.push(['Class Records', recs.slice(0,8).map(r=>{ const st=studentById(r.studentId); return {label:`${st?st.name:'?'} · ${r.subject} · ${r.date}`, go:()=>navigate('studentDetail',{id:r.studentId,tab:'records'})}; })]);

  const exams = DB.exams.filter(e=>(e.name+' '+e.subject).toLowerCase().includes(q));
  if(exams.length) groups.push(['Exams', exams.slice(0,8).map(e=>{ const st=studentById(e.studentId); return {label:`${e.name} — ${st?st.name:'?'}`, go:()=>navigate('studentDetail',{id:e.studentId,tab:'exams'})}; })]);

  const hw = DB.homework.filter(h=>(h.subject+' '+h.homework).toLowerCase().includes(q));
  if(hw.length) groups.push(['Homework', hw.slice(0,8).map(h=>{ const st=studentById(h.studentId); return {label:`${st?st.name:'?'} · ${h.subject}: ${h.homework}`, go:()=>navigate('studentDetail',{id:h.studentId,tab:'homework'})}; })]);

  if(groups.length===0){ resultsEl.style.display='block'; resultsEl.innerHTML = `<div class="sr-item">No results for "${escapeHTML(q)}"</div>`; return; }

  resultsEl.style.display='block';
  resultsEl.innerHTML = groups.map(([cat,items])=>items.map((it,i)=>`
    <div class="sr-item" data-sr="${cat}-${i}">${i===0?`<div class="sr-cat">${cat}</div>`:''}${escapeHTML(it.label)}</div>
  `).join('')).join('');

  let flatIdx=0;
  groups.forEach(([cat,items])=>items.forEach(it=>{
    const el = resultsEl.querySelector(`[data-sr="${cat}-${items.indexOf(it)}"]`);
    if(el) el.addEventListener('click', ()=>{ it.go(); document.getElementById('searchBar').style.display='none'; resultsEl.style.display='none'; document.getElementById('searchInput').value=''; });
  }));
}
